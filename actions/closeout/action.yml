name: PR Closeout Gate
description: >-
  Evidence-first PR closeout gate: strict 19-check tier or repo-defined engine
  tier, as a plan preview or the full enforcing run. All logic lives in
  support.js; this file is wiring only.

inputs:
  run:
    description: "plan (read-only preview) or full (enforcing gate)"
    default: plan
  mode:
    description: "strict (19-check gate) or engine (config.engineChecks)"
    default: strict
  base-ref:
    description: "Live PR base ref; empty resolves via GITHUB_BASE_REF or the event payload"
    default: ""
  config:
    description: "Path to a closeout config JSON"
    default: ""
  output-dir:
    description: "Evidence directory (must be outside the repository)"
    default: ""
  node-version:
    description: "Node.js version for the gate"
    default: "24"
  pr-comment:
    description: "true to upsert a marker-tagged PR comment (needs pull-requests: write)"
    default: "false"
  artifact-name:
    description: "Evidence artifact name"
    default: closeout-evidence

outputs:
  status:
    description: "overallStatus (full) or planStatus (plan); empty until the gate step has run"
    value: ${{ steps.gate.outputs.status }}
  mode:
    description: "The gate-reported mode of the run; empty until the gate step has run"
    value: ${{ steps.gate.outputs.mode }}
  attestation:
    description: "Plan runs: present | weakened | absent | unavailable; empty until the gate step has run"
    value: ${{ steps.gate.outputs.attestation }}
  report-path:
    description: "Path of report.json (full) or the captured plan JSON (plan); empty until the gate step has run"
    value: ${{ steps.gate.outputs.report-path }}
  admission-status:
    description: "Plan runs: PASS | FAIL | BLOCKED | unavailable. Aggregate of the admission sub-probes (attestation, cleanTree, preflight); distinguishes a matrix-resolution PASS from a fully-admissible PASS. Empty on full runs and until the gate step has run."
    value: ${{ steps.gate.outputs.admission-status }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run closeout gate
      id: gate
      shell: bash
      env:
        CLOSEOUT_RUN: ${{ inputs.run }}
        CLOSEOUT_MODE: ${{ inputs.mode }}
        CLOSEOUT_BASE_REF: ${{ inputs.base-ref }}
        CLOSEOUT_CONFIG: ${{ inputs.config }}
        CLOSEOUT_OUTPUT_DIR: ${{ inputs.output-dir || format('{0}/closeout-evidence', runner.temp) }}
        CLOSEOUT_PR_COMMENT: ${{ inputs.pr-comment }}
        CLOSEOUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        GH_TOKEN: ${{ github.token }}
      run: node "${{ github.action_path }}/support.js" run

    - name: Upload evidence artifact
      # runSubcommand ('run') always returns exit 0 for a legitimate gate
      # verdict, even BLOCKED/FAIL — the job's own pass/fail is decided later,
      # by "Apply gate verdict". The "gate" step's outcome is 'success' for
      # EVERY legitimate verdict path (BLOCKED/FAIL/PASS all exit 0), and
      # anything else means run() never validated inputs.output-dir at all:
      # 'failure' means run() THREW (an invalid output-dir — e.g. inside the
      # workspace, rejected by assertOutputOutsideWorkspace before anything
      # is written — bad inputs, or another validation error); 'skipped'
      # means an EARLIER step (e.g. Set up Node.js) failed, so "Run closeout
      # gate" never executed at all (chatgpt-codex-connector PR7 #6YaIav) —
      # `steps.gate.outcome != 'failure'` alone left this case uncaught,
      # since 'skipped' != 'failure' too. In either non-success case,
      # `inputs.output-dir` may resolve to a path never checked against the
      # workspace — e.g. the repository root — so uploading it would publish
      # the checkout (and any secrets a prior step left there) as if it were
      # evidence. Require the gate step to have actually run and exited 0;
      # on every legitimate verdict (including BLOCKED/FAIL) it still runs
      # via always() (CodeRabbit #6YT0J3).
      #
      # `path:` enumerates this action's own well-known evidence filenames
      # instead of the whole output-dir (chatgpt-codex-connector PR7 #6Yb3lY,
      # P1, following the README's already-documented "future hardening"
      # note for #6YYcNT): uploading the bare directory means a caller who
      # points `output-dir` at an existing broad path (`${{ runner.temp }}`,
      # `/tmp`) has EVERY file already there — including logs or credential
      # material left by an earlier step — published as if it were this
      # gate's own evidence. `actions/upload-artifact`'s `path:` treats a
      # multi-line value as separate search patterns (the same convention
      # #6Yb3lN's CR/LF rejection in support.js guards against for a
      # caller-supplied value; here the multi-line value is ours, not
      # caller-controlled, so it is exactly the intended use), so this now
      # only ever globs the exact names support.js/the spawned CLI can
      # produce. `if-no-files-found: ignore` already tolerates whichever of
      # these a given tier does not write (e.g. plan.json on a full run).
      # Residual risk, unchanged from before and already documented in the
      # README: an unrelated tool coincidentally using one of these same
      # generic names in that same shared directory would still be picked
      # up — narrower than uploading the directory wholesale, but not zero.
      if: ${{ always() && steps.gate.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output-dir || format('{0}/closeout-evidence', runner.temp) }}/plan.json
          ${{ inputs.output-dir || format('{0}/closeout-evidence', runner.temp) }}/report.json
          ${{ inputs.output-dir || format('{0}/closeout-evidence', runner.temp) }}/report.md
          ${{ inputs.output-dir || format('{0}/closeout-evidence', runner.temp) }}/action-state.json
          ${{ inputs.output-dir || format('{0}/closeout-evidence', runner.temp) }}/logs
        if-no-files-found: ignore

    - name: Upsert PR comment
      # steps.gate.outcome != 'skipped': when an EARLIER step (e.g. Set up
      # Node.js) fails, "Run closeout gate" never executes at all — it never
      # exported this invocation's CLOSEOUT_INVOCATION_NONCE to GITHUB_ENV
      # (the very first thing it does), so commentSubcommand's own nonce
      # check (chatgpt-codex-connector PR7 #6YaIao) treats that as "this job
      # has no nonce" and its intentional backward-compat exemption skips the
      # check entirely — a reused output-dir's PRE-EXISTING (unrelated,
      # stale) action-state.json would then be accepted and posted to THIS
      # PR as if it were this run's result (chatgpt-codex-connector PR7
      # #6YaZ5H). 'failure' is deliberately still allowed through: when the
      # gate step itself threw, its nonce WAS exported first, so the same
      # nonce check correctly rejects any stale state on its own — no
      # separate guard needed for that case.
      if: ${{ always() && steps.gate.outcome != 'skipped' && inputs.pr-comment == 'true' }}
      shell: bash
      env:
        CLOSEOUT_OUTPUT_DIR: ${{ inputs.output-dir || format('{0}/closeout-evidence', runner.temp) }}
        GH_TOKEN: ${{ github.token }}
      run: node "${{ github.action_path }}/support.js" comment

    - name: Apply gate verdict
      # Same reasoning as "Upsert PR comment" above: when the gate step never
      # ran at all (outcome 'skipped'), finishSubcommand's nonce check has
      # the identical backward-compat exemption and could apply a stale,
      # unrelated verdict to this job. Skipping this step in that case does
      # not let the job go green — GitHub Actions already marks the overall
      # job's conclusion as failure because of the EARLIER step that failed
      # and caused the skip, independent of what any later step does.
      if: ${{ always() && steps.gate.outcome != 'skipped' }}
      shell: bash
      env:
        CLOSEOUT_OUTPUT_DIR: ${{ inputs.output-dir || format('{0}/closeout-evidence', runner.temp) }}
      run: node "${{ github.action_path }}/support.js" finish
