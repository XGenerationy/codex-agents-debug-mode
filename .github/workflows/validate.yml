name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 20
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          package-manager-cache: false

      - name: Install locked metadata
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate repository
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Smoke Bash installer
        if: runner.os == 'Linux'
        run: |
          bash ./tools/install.sh --target both --home "$RUNNER_TEMP/debug-skill-home"
          test -f "$RUNNER_TEMP/debug-skill-home/.codex/skills/debug/SKILL.md"
          test -f "$RUNNER_TEMP/debug-skill-home/.agents/skills/debug/SKILL.md"

      - name: Smoke PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $homePath = Join-Path $env:RUNNER_TEMP 'debug-skill-home'
          .\tools\install.ps1 -Target Both -HomePath $homePath
          if (-not (Test-Path (Join-Path $homePath '.codex\skills\debug\SKILL.md'))) { throw 'Codex install missing' }
          if (-not (Test-Path (Join-Path $homePath '.agents\skills\debug\SKILL.md'))) { throw 'Agents install missing' }
