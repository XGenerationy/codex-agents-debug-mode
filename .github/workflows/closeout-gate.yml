name: Closeout gate

on:
  pull_request_review:
    types: [submitted, dismissed, edited]
  pull_request:
    # Re-run when the review/base state that admitted a prior gate result
    # changes without a fresh approval: a review dismissal or an edited
    # approval body lands via pull_request_review; a pushed head change
    # (synchronize), a re-opened PR (reopened), a newly-opened PR (opened),
    # or a RETARGET to a different base branch (edited — the attestation is
    # base-bound, so a retarget invalidates it) all must re-trigger the gate
    # so a stale PASS never outlives the state it attested.
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      base-ref:
        description: "Live PR base ref (dispatch runs have no PR context)"
        default: origin/main
  # Re-run once a sibling check that was still pending when the gate last
  # ran has settled (CodeRabbit PR7 #6YW9UP): an approval submitted while
  # "Validate" or "Closeout preview" is still queued/in-progress makes
  # readLivePrState correctly BLOCK on that pending check, but nothing else
  # re-triggers the gate once it later completes — none of the pull_request/
  # pull_request_review activity above fires for another workflow's check
  # completion. Deliberately named-scoped to ONLY these two sibling
  # workflows, NOT "Closeout gate" itself: neither of them has a
  # workflow_run trigger watching for "Closeout gate" completions, so the
  # gate's own run can never re-trigger itself through this path — there is
  # no retrigger loop to guard against here, by construction.
  # KNOWN LIMITATION, not fixed here (chatgpt-codex-connector PR7 #6YaxWe,
  # P1, investigated but left for an owner decision): a workflow_run-
  # triggered run's own implicit GitHub Actions check-run is associated with
  # GITHUB_SHA/github.sha for THIS run's trigger context -- which for
  # workflow_run defaults to the latest commit on the DEFAULT branch, not the
  # completed sibling's PR head -- regardless of what ref the checkout step
  # below actually checks out. Checking out
  # workflow_run.pull_requests[0].head.sha (the Yap8b fix) makes this run
  # TEST the right code; it does not retarget which commit's status-check
  # rollup the run's check-run appears under. Practical effect: even a fully
  # internal PASS from this retry is invisible to `gh pr view
  # --json statusCheckRollup` for the PR and to branch protection's required
  # checks -- verified empirically against this repo's own Actions history
  # (`gh api repos/.../actions/runs?event=workflow_run` returned zero runs
  # ever, out of the last 100 runs across all trigger types, at the time this
  # was written) rather than assumed from docs alone, though the SHA-
  # association behavior itself is standard, widely-documented GitHub Actions
  # semantics independent of that. The retry's Step Summary, evidence
  # artifact, and (if enabled) PR comment still get written either way, since
  # none of those depend on check-run/SHA association.
  #
  # A complete fix means explicitly calling the Checks API (`POST`/`PATCH
  # /repos/{owner}/{repo}/check-runs` with `head_sha` set to the PR's real
  # head) instead of relying on the implicit per-job check-run, which needs a
  # new `checks: write` permission (a meaningfully bigger grant than this
  # workflow's current all-read set) and a design decision on identity: does
  # the new check-run replace the pull_request-triggered gate's own check (by
  # matching `name`), or does it publish as a visibly distinct check that
  # branch protection would need to additionally require? Left for the
  # maintainer to choose rather than guessed at here.
  workflow_run:
    workflows: ["Validate", "Closeout preview"]
    types: [completed]

# KNOWN LIMITATION, not fixed here (chatgpt-codex-connector PR7 #6YbMwY, P1,
# investigated but left for an owner decision): none of the triggers above
# fire from a PUSH to the BASE branch itself (e.g. another PR merging into
# main) when this PR's own head and review state are unchanged. The gate's
# admission attestation is base-OID-bound, so a PASS minted against the old
# base can remain the PR's live, branch-protection-visible result even after
# the real merge candidate (this head + the NEW base tip) was never verified.
#
# Verified this is a trigger-coverage gap, not a detection gap: the
# admission check in scripts/pr_closeout_github.js (readLiveGateAttestation,
# `pr.baseRefOid !== expectedBaseSha`) already compares the attestation's
# recorded base SHA against a FRESH live read on every actual invocation and
# correctly BLOCKs/FAILs a stale-base attestation with "admission
# attestation is bound to the wrong snapshot" -- so the moment this gate
# runs again for ANY reason, it self-corrects. The gap is purely that
# nothing re-triggers it for a base-only push.
#
# A complete fix needs a genuinely new capability, not a narrow change: a
# `push`-triggered path that DISCOVERS every open PR targeting the pushed
# branch (there is no event payload naming them -- a `gh pr list --base
# <branch> --state open`-shaped query, or the GraphQL search API, would be
# needed) and re-triggers the gate for EACH one. That raises design
# questions with real cost/security tradeoffs a maintainer should decide,
# not infer: how to re-trigger per-PR (a new workflow_dispatch PR-number
# input plus `actions: write` to fire it, vs. restructuring to classify all
# affected PRs in one job), how to bound the cost of re-running the `full`
# engine matrix once per open PR on every base push in a repo with many open
# PRs, and -- since a re-run for a PR whose head was not this run's own
# trigger context risks the SAME check-run/head-SHA-association problem
# documented above for #6YaxWe -- how results get published back onto each
# affected PR's own head SHA.
permissions:
  contents: read
  pull-requests: read
  # checks: read is required for the gate's readLivePrState to read the
  # statusCheckRollup (check runs) via gh pr view --json. Without it, the
  # live-state classifier cannot see check conclusions once an attestation
  # admits the run to final verification.
  checks: read
  # statuses: read covers the LEGACY commit-status contexts (StatusContext)
  # that statusCheckRollup can also return — normalizeCheck classifies them
  # alongside check runs, and a repo with a legacy status context (e.g. an
  # external CI posting a commit status) would otherwise be unreadable,
  # leaving the gate BLOCKED on an unavailable rollup (Codex 3745211664).
  statuses: read
  # actions: read is required for resolveCurrentJobDisplayName's Jobs API
  # call (GET .../actions/runs/{run_id}/jobs), used to resolve this job's
  # true displayed name for self-exclusion on a matrixed/named check
  # (CodeRabbit PR7 #6YXkRF). An explicit permissions block disables every
  # unlisted scope, so without this the call 403s, the resolver's catch
  # falls back to null, self-exclusion silently no-ops for this matrixed
  # job, and an otherwise-clean gate run permanently BLOCKs on its own
  # in-progress check (chatgpt-codex-connector PR7 #6YZpcr).
  actions: read

# cancel-in-progress is deliberately FALSE for the enforcing gate: workflow-level
# concurrency is evaluated before the job-level if, so a comment-only review
# submitted mid-run would otherwise cancel an in-flight gate and then skip
# itself — leaving the PR with no gate result and no automatic re-trigger. A
# cancelled gate result is a missing gate result; a superseded run invalidates
# itself anyway because the attestation is head-bound. The preview workflow
# keeps newest-wins cancellation, where it is correct.
#
# github.event.pull_request.number covers pull_request/pull_request_review
# events; workflow_run events carry no top-level pull_request, so a
# same-repo PR's number instead comes from
# workflow_run.pull_requests[0].number (empty for fork PRs — see the
# workflow_run trigger comment above and the checkout step below). Without
# this fallback, EVERY workflow_run-triggered gate run across every PR would
# share one concurrency group keyed on github.ref (the base branch), each
# needlessly queuing behind or cancelling unrelated PRs' runs.
concurrency:
  group: closeout-gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # Cost guard only: the gate independently re-verifies the live review
    # state, head SHA, and attestation through gh — this condition just
    # avoids spending a full run on no-op events. It runs on:
    # any pull_request activity (head change, reopen, base retarget), a
    # newly-submitted approval, any dismissed review (GitHub only fires
    # `dismissed` for reviews that held a state, so this re-runs the gate
    # whenever an attestation-holding approval is dismissed), an EDITED
    # approval only (its attestation-marker body may have changed; an edited
    # non-approval is unchanged state), a newly-submitted
    # CHANGES_REQUESTED review (a follow-up changes-requested from the
    # attesting reviewer flips reviewDecision and must produce a fresh FAIL
    # gate result rather than leaving the prior PASS live), and a
    # newly-submitted COMMENT review (inline comments open unresolved
    # threads that readLivePrState would block, so a prior PASS must not
    # survive a comment review attached to the unchanged head), and a
    # COMPLETED run of a sibling workflow this PR's gate result may have
    # been waiting on (CodeRabbit PR7 #6YW9UP) — the sibling's own
    # conclusion (success/failure/etc.) does not matter here; only that it
    # finished, so the gate can re-evaluate the live rollup. Restricted to
    # workflow_run events whose OWN trigger was pull_request (qodo PR7
    # #6YZnHn): "Validate" also runs on push to main and workflow_dispatch,
    # neither of which carries PR context, so an unguarded workflow_run
    # condition would spend a full gate run on every mainline push only to
    # land on an unresolvable-PR BLOCKED result. A fork PR's workflow_run
    # still has event == 'pull_request' and is intentionally let through
    # here even though its pull_requests[] array is separately empty (see
    # the workflow_run trigger comment above) — that is a legitimate
    # PR-associated completion, just one this gate cannot yet resolve.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.review.state == 'approved' || github.event.review.state == 'changes_requested' || github.event.review.state == 'commented' || github.event.action == 'dismissed' || (github.event.action == 'edited' && github.event.review.state == 'approved') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Check out the PR head SHA — fork-safe (head.ref names the fork's
          # branch, which is absent from the base repo and would fail checkout
          # for fork PRs). The gate's argument-less `gh pr view` resolves the
          # PR from the Actions event context even though HEAD is detached, so
          # detached HEAD is not a problem here.
          #
          # workflow_run events carry no top-level pull_request. Prefer
          # workflow_run.pull_requests[0].head.sha (the PR's actual head
          # commit, populated for a same-repo PR) over workflow_run.head_sha
          # (chatgpt-codex-connector PR7 #6Yap8b): workflow_run.head_sha is
          # whatever SHA the upstream workflow itself ran against, and
          # .github/workflows/validate.yml's checkout uses actions/checkout's
          # DEFAULT ref — which for a pull_request-triggered run resolves to
          # the synthetic test-merge commit, not the PR's real head branch
          # commit. Checking that out here would make readLivePrState's
          # expectedHeadSha systematically mismatch the PR's live headRefOid,
          # so a workflow_run-triggered retry could never reach PASS. Keep
          # workflow_run.head_sha as a final fallback for a fork PR (whose
          # pull_requests[] is separately empty — the gate cannot resolve PR
          # context there regardless of which SHA is checked out, so this
          # fallback is inert rather than wrong in that case), then
          # github.ref (workflow_dispatch with no PR context). The gate
          # independently re-verifies the live head via gh and BLOCKS stale
          # snapshots regardless.
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          # Do NOT persist the checkout's extra git credentials into the
          # local config: the full engine matrix then executes PR-controlled
          # commands (npm test, etc.), and a malicious check could otherwise
          # use the saved credential helper to push as the workflow token.
          persist-credentials: false

      # KNOWN LIMITATION, not fixed here (chatgpt-codex-connector PR7 #6YaxWT,
      # P1, investigated but left for an owner decision): `./actions/closeout`
      # resolves action.yml + support.js from the working tree just checked
      # out above -- which for pull_request-triggered runs IS the PR's own,
      # potentially untrusted, commit. A PR that edits those files controls
      # what this step executes, with whatever `github.token` this job holds.
      #
      # Two structural facts bound the actual blast radius today, verified
      # against this repo's current state rather than assumed:
      #   1. The permissions: block above is entirely READ-only (contents,
      #      pull-requests, checks, statuses, actions) -- no write scope is
      #      requested, so even fully hostile injected code cannot use this
      #      token to push, comment, or modify anything. For fork PRs, GitHub
      #      additionally hard-caps the token to read-only server-side
      #      regardless of what a fork-supplied workflow file requests, which
      #      is the actual threat model this trigger runs under.
      #   2. Neither sibling workflow (validate.yml, closeout-preview.yml)
      #      references any secret beyond the implicit GITHUB_TOKEN, and
      #      neither uploads an artifact -- checked directly (`grep -n
      #      'secrets\.' .github/workflows/*.yml`) rather than assumed, so
      #      `actions: read` in a compromised run cannot currently reach any
      #      OTHER workflow's secret or artifact in this repo. It can still
      #      list/read this workflow's OWN past runs' evidence artifacts
      #      (chatgpt-codex-connector's stated concern) via the Actions API.
      #
      # A COMPLETE fix means never executing PR-controlled code with any live
      # token -- e.g. referencing this action by a pinned, trusted remote ref
      # (owner/repo/actions/closeout@<sha-on-the-base-branch>) instead of the
      # local `./actions/closeout` path, or splitting into a trusted outer
      # workflow plus an isolated, tokenless inner job with an artifact-based
      # handoff. Either one is a genuine trust-model tradeoff: pinning to a
      # base-branch ref means a PR that is ITSELF changing this action (like
      # the PR that introduced this comment) can no longer gate itself with
      # its own in-flight changes until merged, which is a deliberate
      # decision about how this repo bootstraps its own gating action, not a
      # narrow code fix -- left for the maintainer to choose.
      - name: Closeout gate
        uses: ./actions/closeout
        with:
          run: full
          # This repo is npm-based (no pnpm lockfile, no Prisma), so the
          # strict 19-check matrix would BLOCK on missing pnpm/Prisma
          # preflight. Engine mode runs this repo's authoritative checks
          # (npm test / npm run validate / scan:suppressions / git diff)
          # declared in .github/closeout-engine.json instead. The attestation
          # digest binds to the engine matrix, so a strict-minted attestation
          # can never satisfy this gate and vice versa.
          mode: engine
          config: .github/closeout-engine.json
          base-ref: ${{ github.event.inputs.base-ref || '' }}
