name: Closeout gate

on:
  pull_request_review:
    types: [submitted, dismissed, edited]
  pull_request:
    # Re-run when the review state that admitted a prior gate result changes
    # without a fresh `submitted` event: a `CHANGES_REQUESTED` submission is
    # already filtered by the job condition below, but a review dismissal
    # (dismissed) or an edited approval body lands via pull_request_review,
    # while a pushed head change or a re-opened PR must re-trigger the gate
    # so a stale PASS never outlives the state it attested.
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      base-ref:
        description: "Live PR base ref (dispatch runs have no PR context)"
        default: origin/main

permissions:
  contents: read
  pull-requests: read

# cancel-in-progress is deliberately FALSE for the enforcing gate: workflow-level
# concurrency is evaluated before the job-level if, so a comment-only review
# submitted mid-run would otherwise cancel an in-flight gate and then skip
# itself — leaving the PR with no gate result and no automatic re-trigger. A
# cancelled gate result is a missing gate result; a superseded run invalidates
# itself anyway because the attestation is head-bound. The preview workflow
# keeps newest-wins cancellation, where it is correct.
concurrency:
  group: closeout-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # Cost guard only: the gate independently re-verifies the live review
    # state, head SHA, and attestation through gh — this condition just
    # avoids spending a full run on comment-only review events. The
    # pull_request triggers (opened/reopened/synchronize), a dismissed
    # approval, a newly-submitted approval, and an EDITED approval all run:
    # a head change or a revoked/revised approval must produce a fresh gate
    # result so a stale PASS cannot outlive the state it attested (the gate
    # then BLOCKS on the no-longer-APPROVED review decision rather than
    # trusting the prior run). The edited clause is constrained to approvals:
    # an edited approval may have its attestation-marker body changed, which
    # must invalidate the gate, but an edited NON-approval (a comment-only
    # review edit) is unchanged state and has nothing to invalidate — running
    # the full gate on it is pure cost.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.review.state == 'approved' || github.event.action == 'dismissed' || (github.event.action == 'edited' && github.event.review.state == 'approved') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The gate re-verifies the live head via gh and BLOCKS stale
          # snapshots; the checkout must present the head being attested.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Closeout gate
        uses: ./actions/closeout
        with:
          run: full
          base-ref: ${{ github.event.inputs.base-ref || '' }}
